[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-canary-pipeline"
version = "0.2.0"
description = "KPI-gated progressive delivery for ML models — extends Gaddam (2023)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "mlflow>=2.12,<3.0",
  "prometheus-client>=0.20,<1.0",
  "pydantic>=2.7,<3.0",
  "scikit-learn>=1.4,<2.0",
  "xgboost>=2.0,<3.0",
  "lightgbm>=4.3,<5.0",
  "imbalanced-learn>=0.12,<1.0",
  "scipy>=1.12,<2.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "joblib>=1.3,<2.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.5,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
